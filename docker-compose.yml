version: '3.8'

services:
  # Database: PostgreSQL 15 with PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: genting_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-genting_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - genting_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - genting_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-genting_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & Queue: Redis
  redis:
    image: redis:7-alpine
    container_name: genting_redis
    restart: always
    ports:
      - "6389:6379"
    networks:
      - genting_network

networks:
  genting_network:
    driver: bridge

volumes:
  genting_db_data:
