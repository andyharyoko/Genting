version: '3.8'

services:
  # Frontend: React WebGIS (Vite)
  webgis:
    build:
      context: ./webgis
      dockerfile: Dockerfile
    container_name: genting_frontend
    restart: always
    ports:
      - "8010:80"
    networks:
      - genting_network
    depends_on:
      - backend

  # Backend: Laravel API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genting_backend
    restart: always
    ports:
      - "8011:8000"
    environment:
      - APP_NAME=Laravel
      - APP_ENV=production
      - APP_KEY=base64:V/t41g0xQzUTjCE28Uhk+9SUhAEHH1sK9YiSNCa6bV4=
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-genting_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - SESSION_DRIVER=database
      - CACHE_STORE=database
    volumes:
      # Optional: bind mount storage for persistent logs/uploads
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - genting_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Database: PostgreSQL 15 with PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: genting_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-genting_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - genting_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - genting_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-genting_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & Queue: Redis
  redis:
    image: redis:7-alpine
    container_name: genting_redis
    restart: always
    ports:
      - "6389:6379"
    networks:
      - genting_network

networks:
  genting_network:
    driver: bridge

volumes:
  genting_db_data:
